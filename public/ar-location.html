<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Location Tracking</title>
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Include AR.js with location-based features -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: monospace;
      }
      .a-enter-vr {
        display: none !important;
      }
      /* Loading Screen */
      #arjs-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(9, 9, 11, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #00f3ff;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 243, 255, 0.1);
        border-top-color: #00f3ff;
        border-radius: 50%;
        animation: spin 1s infinite linear;
        margin-bottom: 12px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #direction-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.85);
        color: #00f3ff;
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid rgba(0, 243, 255, 0.3);
        font-size: 12px;
        z-index: 999;
        pointer-events: none;
      }
    </style>
    <script>
      window.addEventListener('load', () => {
        // Parse parameters from query string
        const urlParams = new URLSearchParams(window.location.search);
        const lat = parseFloat(urlParams.get('lat')) || 0;
        const lng = parseFloat(urlParams.get('lng')) || 0;
        const modelName = urlParams.get('model') || 'react-logo';

        const scene = document.querySelector('a-scene');

        // Configure the camera with simulated coordinates
        const camera = document.querySelector('[gps-camera]');
        camera.setAttribute('gps-camera', `simulateLatitude: ${lat}; simulateLongitude: ${lng}; minDistance: 1; maxDistance: 100;`);

        // Portals configuration (roughly 15 meters North, South, East, West)
        const offset = 0.00015; // roughly 16.6 meters
        const portals = [
          { name: 'North Portal', lat: lat + offset, lng: lng, color: '#00f3ff' },
          { name: 'South Portal', lat: lat - offset, lng: lng, color: '#ff007f' },
          { name: 'East Portal', lat: lat, lng: lng + offset, color: '#39ff14' },
          { name: 'West Portal', lat: lat, lng: lng - offset, color: '#ffff00' }
        ];

        // Create and append the location markers
        portals.forEach(portal => {
          const entity = document.createElement('a-entity');
          entity.setAttribute('gps-entity-place', `latitude: ${portal.lat}; longitude: ${portal.lng};`);
          entity.setAttribute('scale', '3 3 3');
          entity.setAttribute('position', '0 0 0');

          // Portal Structure (Torus)
          const ring = document.createElement('a-torus');
          ring.setAttribute('radius', '0.5');
          ring.setAttribute('radius-tubular', '0.02');
          ring.setAttribute('color', portal.color);
          ring.setAttribute('material', 'emissive: ' + portal.color + '; emissiveIntensity: 1.5; roughness: 0.1');
          ring.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
          entity.appendChild(ring);

          // Central Object
          const core = document.createElement('a-octahedron');
          core.setAttribute('radius', '0.15');
          core.setAttribute('color', portal.color);
          core.setAttribute('material', 'emissive: ' + portal.color + '; emissiveIntensity: 1; roughness: 0.2');
          core.setAttribute('animation', 'property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear');
          entity.appendChild(core);

          // Portal Label
          const label = document.createElement('a-text');
          label.setAttribute('value', portal.name);
          label.setAttribute('align', 'center');
          label.setAttribute('position', '0 0.8 0');
          label.setAttribute('scale', '0.8 0.8 0.8');
          label.setAttribute('color', '#ffffff');
          label.setAttribute('font', 'monoid');
          entity.appendChild(label);

          scene.appendChild(entity);
        });

        // Hide loader when scene loads
        scene.addEventListener('renderstart', () => {
          const loader = document.getElementById('arjs-loader');
          if (loader) loader.style.display = 'none';
        });

        // Broadcast direction/location state to indicator
        window.parent.postMessage({ type: 'ar-ready' }, '*');
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div id="arjs-loader">
      <div class="spinner"></div>
      <div>Initializing GPS & Camera...</div>
    </div>
    
    <div id="direction-indicator">
      Drag screen or look around to find the 4 portals (N, S, E, W)
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      vr-mode-ui="enabled: false"
    >
      <!-- Camera with gps-camera & wasd/look-controls for testing on desktop -->
      <a-camera gps-camera rotation-reader look-controls></a-camera>
    </a-scene>
  </body>
</html>
