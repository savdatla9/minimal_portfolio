<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js Marker Tracking</title>
    <!-- Include A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Include AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: monospace;
      }
      /* Hide A-Frame default VR button */
      .a-enter-vr {
        display: none !important;
      }
      /* Loading Screen */
      #arjs-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(9, 9, 11, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #00f3ff;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 243, 255, 0.1);
        border-top-color: #00f3ff;
        border-radius: 50%;
        animation: spin 1s infinite linear;
        margin-bottom: 12px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Component to dynamically load models based on message or URL
      AFRAME.registerComponent('dynamic-model', {
        schema: {
          model: { type: 'string', default: 'react-logo' }
        },
        init: function () {
          // Listen for postMessages from parent
          window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'change-model') {
              this.updateModel(event.data.model);
            }
          });

          // Check URL parameters for initial model
          const urlParams = new URLSearchParams(window.location.search);
          const initialModel = urlParams.get('model') || 'react-logo';
          this.updateModel(initialModel);

          // Signal to parent that AR engine is ready
          window.parent.postMessage({ type: 'ar-ready' }, '*');
          
          // Hide loader once scene loads
          const sceneEl = this.el.sceneEl;
          sceneEl.addEventListener('renderstart', () => {
            const loader = document.getElementById('arjs-loader');
            if (loader) loader.style.display = 'none';
          });
        },
        updateModel: function (modelName) {
          const el = this.el;
          
          // Clear current children
          while (el.firstChild) {
            el.removeChild(el.firstChild);
          }

          if (modelName === 'react-logo') {
            // Build procedural 3D React Logo
            const container = document.createElement('a-entity');
            container.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear');
            container.setAttribute('position', '0 0.5 0');
            container.setAttribute('scale', '1.5 1.5 1.5');

            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', '0.08');
            sphere.setAttribute('color', '#00f3ff');
            sphere.setAttribute('material', 'emissive: #00f3ff; emissiveIntensity: 2; roughness: 0.1');
            container.appendChild(sphere);

            // Three rings
            const rotations = ['60 0 0', '60 60 0', '60 -60 0'];
            rotations.forEach(rot => {
              const ring = document.createElement('a-torus');
              ring.setAttribute('radius', '0.25');
              ring.setAttribute('radius-tubular', '0.008');
              ring.setAttribute('rotation', rot);
              ring.setAttribute('color', '#00f3ff');
              ring.setAttribute('material', 'emissive: #00f3ff; emissiveIntensity: 1; roughness: 0.2');
              container.appendChild(ring);
            });

            // Grid under the model
            const grid = document.createElement('a-grid');
            grid.setAttribute('width', '1.5');
            grid.setAttribute('height', '1.5');
            grid.setAttribute('position', '0 -0.1 0');
            grid.setAttribute('cell-size', '0.15');
            grid.setAttribute('color-grid', '#00f3ff');
            grid.setAttribute('opacity', '0.3');
            container.appendChild(grid);

            el.appendChild(container);
          } else if (modelName === 'shoe') {
            // Load GLTF shoe
            const entity = document.createElement('a-entity');
            entity.setAttribute('gltf-model', 'url(/shoe-draco.glb)');
            entity.setAttribute('scale', '3.5 3.5 3.5');
            entity.setAttribute('position', '0 0.2 0');
            entity.setAttribute('rotation', '0 0 0');
            entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');
            el.appendChild(entity);
          } else if (modelName === 'cup') {
            // Load GLTF coffee cup
            const entity = document.createElement('a-entity');
            entity.setAttribute('gltf-model', 'url(/cup.glb)');
            entity.setAttribute('scale', '5.0 5.0 5.0');
            entity.setAttribute('position', '0 0.1 0');
            entity.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');
            el.appendChild(entity);
          }
        }
      });
      
      // Marker events communicator
      AFRAME.registerComponent('marker-events', {
        init: function () {
          const marker = this.el;
          marker.addEventListener('markerFound', () => {
            window.parent.postMessage({ type: 'marker-found' }, '*');
          });
          marker.addEventListener('markerLost', () => {
            window.parent.postMessage({ type: 'marker-lost' }, '*');
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div id="arjs-loader">
      <div class="spinner"></div>
      <div>Loading AR Engine...</div>
    </div>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
      vr-mode-ui="enabled: false"
    >
      <a-marker preset="hiro" marker-events id="hiro-marker">
        <a-entity dynamic-model></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
